<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Your website</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1d2433;background:#fff}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 6vw;border-bottom:1px solid #eceff3}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo i{width:30px;height:30px;border-radius:9px;background:#d9dee6}
nav{display:flex;gap:26px;font-size:14px;color:#5b6474}nav b{background:#1d2433;color:#fff;padding:9px 16px;border-radius:99px;font-weight:600}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:5vw;align-items:center;padding:8vh 6vw}
h1{font-size:clamp(30px,4.4vw,58px);line-height:1.04;margin:0 0 16px;letter-spacing:-.02em}
p{color:#5b6474;line-height:1.6;font-size:17px;margin:0 0 24px}
.btns{display:flex;gap:10px}.btns span{padding:13px 20px;border-radius:99px;background:#1d2433;color:#fff;font-weight:600}.btns span+span{background:#eef1f5;color:#1d2433}
.img{aspect-ratio:4/3;border-radius:24px;background:linear-gradient(135deg,#dfe5ee,#c9d2df);display:grid;place-items:center;color:#8a95a8;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:0 6vw 10vh}.cards div{padding:26px;border-radius:20px;background:#f5f7fa}
.cards b{display:block;margin-bottom:8px}.cards s{display:block;height:10px;border-radius:9px;background:#e1e6ee;margin-top:10px;text-decoration:none}
.tag{display:inline-block;margin-bottom:14px;padding:6px 12px;border-radius:99px;background:#eef1f5;font-size:12px;font-weight:700;letter-spacing:.06em;color:#5b6474}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:5vh 6vw}nav span{display:none}.cards{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo"><i></i>Your business</div><nav><span>Services</span><span>Projects</span><span>About</span><b>Contact</b></nav></header>
<section class="hero"><div><span class="tag">SAMPLE WEBSITE</span><h1>This is where your own website appears.</h1><p>Add your website address in the editor to see AVA on your real site. This sample shows how the chat sits on top of any page.</p><div class="btns"><span>Get a quote</span><span>Our work</span></div></div><div class="img">Your photo</div></section>
<section class="cards"><div><b>Service one</b><s></s><s style="width:70%"></s></div><div><b>Service two</b><s></s><s style="width:80%"></s></div><div><b>Service three</b><s></s><s style="width:60%"></s></div></section>
</body></html>
