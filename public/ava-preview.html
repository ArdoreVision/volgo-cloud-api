<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Volgo preview</title>
<style>html,body{margin:0;height:100%;background:#f5f7fa}iframe{display:block;width:100%;height:100%;border:0}</style></head>
<body><iframe id="site" title="Your website" referrerpolicy="no-referrer"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search), u = q.get("u") || "", k = (q.get("k") || "").replace(/[^a-zA-Z0-9_-]/g, "");
  document.getElementById("site").src = /^https:\/\/[^\s]+$/.test(u) ? u : "/voorbeeld/jouw-site.html";
  if (!k) return;
  var s = document.createElement("script"); s.src = "/ava.js"; s.setAttribute("data-key", k); s.setAttribute("data-preview", "1");
  document.body.appendChild(s);
})();
</script></body></html>
