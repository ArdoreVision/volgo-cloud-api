name: Adres controleren
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - run: |
          echo "::warning::STRIPE soort ${STRIPE_SECRET_KEY:0:8} lengte ${#STRIPE_SECRET_KEY}"
          a=$(curl -s https://api.stripe.com/v1/account -u "$STRIPE_SECRET_KEY:")
          echo "::warning::ACCOUNT $(echo "$a" | jq -c '{id,charges_enabled,payouts_enabled,details_submitted,country,default_currency,naam:.business_profile.name,afschrift:.settings.payments.statement_descriptor,url:.business_profile.url,eisen:.requirements.currently_due,fout:.error.message}')"
          p=$(curl -s "https://api.stripe.com/v1/payment_method_configurations?limit=3" -u "$STRIPE_SECRET_KEY:")
          echo "::warning::METHODES $(echo "$p" | jq -c '[.data[]? | {naam:.name, kaart:.card.available, ideal:.ideal.available, sepa:.sepa_debit.available, bancontact:.bancontact.available}]')"
          c=$(curl -s "https://api.stripe.com/v1/billing_portal/configurations?limit=5" -u "$STRIPE_SECRET_KEY:")
          echo "::warning::PORTAL $(echo "$c" | jq -c '[.data[]? | {id, meta:.metadata}]')"
          s=$(curl -s "https://api.stripe.com/v1/subscriptions?limit=5&status=all" -u "$STRIPE_SECRET_KEY:")
          echo "::warning::ABO $(echo "$s" | jq -c '[.data[]? | {status, livemode}]')"
