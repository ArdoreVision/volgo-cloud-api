name: Adres controleren
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - run: |
          for u in https://thevolgo.app/ https://www.thevolgo.app/ https://thevolgo.app/og.png https://volgo.damienhanssens.workers.dev/; do
            echo "::warning::PROBE $u $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 $u)"
          done
          r=$(curl -s https://api.stripe.com/v1/balance -u "$STRIPE_SECRET_KEY:")
          echo "::warning::STRIPE sleutel begint ${STRIPE_SECRET_KEY:0:8} lengte ${#STRIPE_SECRET_KEY} | $(echo "$r" | head -c 300 | tr '\n' ' ')"
          echo "::warning::DNS $(dig +short thevolgo.app | tr '\n' ' ')"
