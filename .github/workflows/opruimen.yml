name: Testdata opruimen
on: workflow_dispatch
jobs:
  op:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          cd /tmp
          q() { npx -y wrangler@4 d1 execute volgo-db --remote --json --command "$1" 2>/dev/null; }
          echo "::warning::VOOR $(q "SELECT COUNT(*) n FROM gebruikers WHERE email LIKE 'test%@volgo.test'" | jq -c '.[0].results')"
          cat > op.sql <<'SQL'
          DELETE FROM ava_berichten WHERE gesprek_id IN (SELECT id FROM ava_gesprekken WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test'));
          DELETE FROM ava_gesprek_meta WHERE gesprek_id IN (SELECT id FROM ava_gesprekken WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test'));
          DELETE FROM ava_gesprekken WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM afspraken WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM ava_instellingen WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM ava_stijl WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM berichten WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM kanalen WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM onboarding WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM sites WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM uitnodigingen WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM website_aanvragen WHERE team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test') OR team_id = (SELECT id FROM gebruikers WHERE email='demo@volgo.test');
          DELETE FROM klant_leads WHERE gebruiker_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM meldingen WHERE gebruiker_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM sessies WHERE gebruiker_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM wachtwoord_resets WHERE gebruiker_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM team_leden WHERE gebruiker_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test') OR team_id IN (SELECT id FROM gebruikers WHERE email LIKE 'test%@volgo.test');
          DELETE FROM gebruikers WHERE email LIKE 'test%@volgo.test';
          DELETE FROM limieten;
          SQL
          sed -i 's/^          //' op.sql
          npx -y wrangler@4 d1 execute volgo-db --remote --file op.sql > out.txt 2>&1 || { tail -5 out.txt | while read l; do echo "::warning::FOUT $l"; done; exit 1; }
          echo "::warning::NA $(q "SELECT COUNT(*) n, (SELECT COUNT(*) FROM gebruikers) totaal, (SELECT COUNT(*) FROM website_aanvragen) aanvragen FROM gebruikers WHERE email LIKE 'test%@volgo.test'" | jq -c '.[0].results')"
          echo "::warning::OVER $(q "SELECT email, plan, status FROM gebruikers" | jq -c '.[0].results')"
      - name: Stripe-testabonnementen van verwijderde accounts stoppen
        env:
          K: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          [[ "$K" == sk_test_* ]] || { echo "::warning::STRIPE live: niets gestopt"; exit 0; }
          cd /tmp
          npx -y wrangler@4 d1 execute volgo-db --remote --json --command "SELECT stripe_klant FROM gebruikers WHERE COALESCE(stripe_klant,'') != ''" 2>/dev/null | jq -r '.[0].results[].stripe_klant' > houden.txt
          totaal=$(npx -y wrangler@4 d1 execute volgo-db --remote --json --command "SELECT COUNT(*) n FROM gebruikers" 2>/dev/null | jq -r '.[0].results[0].n // empty')
          [ -n "$totaal" ] || { echo "::warning::STRIPE database niet gelezen: niets gestopt"; exit 0; }
          n=0
          for st in trialing active past_due; do
            curl -s "https://api.stripe.com/v1/subscriptions?status=$st&limit=100" -u "$K:" | jq -r '.data[] | .id + " " + .customer' > subs.txt
            while read sub klant; do
              grep -qx "$klant" houden.txt && continue
              curl -s -X DELETE "https://api.stripe.com/v1/subscriptions/$sub" -u "$K:" > /dev/null; n=$((n+1))
            done < subs.txt
          done
          echo "::warning::STRIPE $n testabonnementen gestopt, $(wc -l < houden.txt) gehouden"
