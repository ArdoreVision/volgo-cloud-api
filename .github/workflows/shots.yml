name: Schermafbeeldingen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/pw /tmp/shots && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          for (const [n, vp, m] of [['d', { width: 1440, height: 900 }, false], ['m', { width: 390, height: 844 }, true]]) {
            const c = await b.newContext({ viewport: vp, deviceScaleFactor: 2, isMobile: m });
            const p = await c.newPage();
            await p.goto('https://thevolgo.app/', { waitUntil: 'networkidle' });
            await p.locator('footer').scrollIntoViewIfNeeded(); await p.waitForTimeout(600);
            await p.locator('footer').screenshot({ path: `/tmp/shots/${n}-footer.png` });
            await p.goto('https://thevolgo.app/pricing', { waitUntil: 'networkidle' });
            await p.locator('.v-pricing__boek').scrollIntoViewIfNeeded(); await p.waitForTimeout(600);
            await p.locator('.v-pricing__boek').screenshot({ path: `/tmp/shots/${n}-boek.png` });
            await c.close();
          }
          await b.close();
          JS
          node s.mjs
          cd /tmp/shots && git init -q && git config user.name bot && git config user.email bot@x && git add -A && git commit -qm s && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:shots
