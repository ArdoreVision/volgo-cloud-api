name: Schermafbeeldingen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/pw /tmp/shots && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          for (const [n, vp, m] of [['d', { width: 1440, height: 900 }, false], ['m', { width: 390, height: 844 }, true]]) {
            const c = await b.newContext({ viewport: vp, deviceScaleFactor: m ? 2 : 1, isMobile: m });
            const p = await c.newPage();
            p.on('pageerror', (e) => console.log('::warning::JS-fout ' + e.message));
            await p.goto('https://thevolgo.app/', { waitUntil: 'networkidle' });
            await p.waitForTimeout(3000);
            await p.screenshot({ path: `/tmp/shots/${n}-0-hero.png` });
            for (const [i, sel] of [['1', '.vx-voorna'], ['2', '.vx-voordelen'], ['3', '.vx-vb'], ['4', '.vx-rank'], ['5', '.vx-reken'], ['6', '.vx-tijd']]) {
              await p.locator(sel).first().scrollIntoViewIfNeeded();
              await p.evaluate((s) => { const el = document.querySelector(s); window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 70); }, sel);
              await p.waitForTimeout(sel === '.vx-vb' ? 6500 : 2600);
              await p.screenshot({ path: `/tmp/shots/${n}-${i}.png` });
            }
            const hidden = await p.evaluate(() => [...document.querySelectorAll('[data-reveal]')].filter((e) => !e.classList.contains('is-in')).length);
            console.log('::warning::' + n + ' niet getoond na scrollen: ' + hidden);
            await c.close();
          }
          await b.close();
          JS
          node s.mjs
          cd /tmp/shots && git init -q && git config user.name bot && git config user.email bot@x && git add -A && git commit -qm s && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:shots
