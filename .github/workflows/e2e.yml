name: Volgo browsertest
on: workflow_dispatch
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      U: https://thevolgo.app
    steps:
      - uses: actions/checkout@v4
      - name: Demo-sessie maken
        run: |
          TOKEN=$(openssl rand -hex 32)
          HASH=$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          cd /tmp && npx -y wrangler@4 d1 execute volgo-db --remote --command "UPDATE gebruikers SET naam='Damien Demo' WHERE email='demo@volgo.test'; INSERT INTO sessies (token_hash, gebruiker_id, verloopt) SELECT '$HASH', id, datetime('now','+1 day') FROM gebruikers WHERE email='demo@volgo.test';" > w.log 2>&1 || { tail -8 w.log | sed 's/^/::error::/'; exit 1; }
      - name: Toegang zonder abonnement
        run: |
          cd /tmp
          q() { npx -y wrangler@4 d1 execute volgo-db --remote --command "$1" > /dev/null 2>&1; }
          q "UPDATE gebruikers SET status='proef', proef_tot=datetime('now','-1 day') WHERE email='demo@volgo.test'"
          echo "::warning::GATE verlopen -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -b volgo_sessie=$TOKEN $U/dashboard)"
          SL=$(npx -y wrangler@4 d1 execute volgo-db --remote --json --command "SELECT a.sleutel FROM ava_instellingen a JOIN gebruikers g ON g.id=a.team_id WHERE g.email='demo@volgo.test'" 2>/dev/null | jq -r '.[0].results[0].sleutel' || true)
          echo "::warning::GATE widget verlopen -> $(curl -s -X POST $U/api/ava -H 'content-type: application/json' -d "{\"actie\":\"config\",\"sleutel\":\"$SL\"}")"
          echo "::warning::GATE assistent verlopen -> $(curl -s -o /dev/null -w '%{http_code}' -b volgo_sessie=$TOKEN $U/api/ava -X POST -H 'content-type: application/json' -d "{\"actie\":\"bericht\",\"sleutel\":\"$SL\",\"tekst\":\"hoi\"}") $(curl -s $U/api/ava -X POST -H 'content-type: application/json' -d "{\"actie\":\"bericht\",\"sleutel\":\"$SL\",\"tekst\":\"hoi\"}" | head -c 90)"
          q "UPDATE gebruikers SET status='actief', proef_tot=NULL WHERE email='demo@volgo.test'"
          echo "::warning::GATE actief -> $(curl -s -o /dev/null -w '%{http_code}' -b volgo_sessie=$TOKEN $U/dashboard)"
          echo "::warning::GATE uitgelogd -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' $U/dashboard)"
      - name: Demo op Premium zetten
        run: cd /tmp && npx -y wrangler@4 d1 execute volgo-db --remote --command "UPDATE gebruikers SET plan='pro' WHERE email='demo@volgo.test'" > /dev/null 2>&1
      - name: Browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && { npm i playwright@1 && npx playwright install --with-deps chromium; } > i.log 2>&1 || { tail -8 i.log | sed 's/^/::error::/'; exit 1; }
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const U = process.env.U, T = process.env.TOKEN;
          const b = await chromium.launch();
          // Visitors choose in the consent screen first; for the tests: "only necessary" on thevolgo.app.
          const nieuw = b.newContext.bind(b);
          b.newContext = async (o) => { const c = await nieuw(o); await c.addInitScript(() => { try { localStorage.setItem('volgo-ok-c2c0abaa339e5c0a8c9e4064', JSON.stringify({ ja: false, op: Date.now() })); } catch (e) {} }); return c; };
          const log = (m) => console.log('::warning::E2E ' + m);
          const shot = (p, n) => p.screenshot({ path: `/tmp/shots/${n}.png` });
          // Nieuwe klant: landing -> abonnement -> betalen -> account -> inloggen -> dashboard
          nieuw: {
            const ctx = await b.newContext({ viewport: { width: 1366, height: 860 } });
            const p = await ctx.newPage();
            p.on('console', (m) => m.type() === 'error' && log('console: ' + m.text().slice(0, 200)));
            p.on('response', (r) => r.status() >= 400 && log('http ' + r.status() + ' ' + r.url().slice(0, 120)));
            const mail = `test${Date.now()}@volgo.test`;
            await p.goto(U + '/pricing'); await p.waitForLoadState('networkidle');
            await p.locator('.v-plan__cta--start').click();
            await p.waitForURL((u) => u.hostname.includes('stripe.com') || u.pathname.startsWith('/checkout'), { timeout: 30000 }).catch(async (e) => { log('na kiezen: ' + p.url() + ' | ' + (await p.locator('.v-err').textContent().catch(() => 'geen fout'))); throw e; });
            if (p.url().includes('stripe.com')) {
              log('stripe checkout geopend');
              await p.waitForSelector('#email', { timeout: 30000 });
              await shot(p, 'stripe');
              if (p.url().includes('cs_live_')) {
                const tekst = (await p.locator('body').innerText()).replace(/\n/g, ' ');
                log('LIVE checkout geopend, geen betaling gedaan | ' + (tekst.match(/€\s?[\d.,]+/g) || []).slice(0, 3).join(' ') + ' | ' + tekst.slice(0, 160));
                await ctx.close(); break nieuw;
              }
              await p.fill('#email', mail);
              if (!(await p.locator('#cardNumber').isVisible().catch(() => false))) await p.locator('[data-testid="card-accordion-item-button"], #payment-method-accordion-item-title-card, label:has-text("Card")').first().click({ force: true });
              await p.waitForSelector('#cardNumber', { state: 'visible', timeout: 15000 });
              await p.locator('#cardNumber').fill('4242424242424242');
              await p.locator('#cardExpiry').fill('12 / 34');
              await p.locator('#cardCvc').fill('123');
              await p.locator('#billingName').fill('Test Klant');
              if (await p.locator('#billingCountry').isVisible().catch(() => false)) await p.selectOption('#billingCountry', 'NL');
              await p.waitForTimeout(800);
              const vul = async (sel, v) => { if (await p.locator(sel).isVisible().catch(() => false)) await p.fill(sel, v); };
              const handmatig = p.locator('button:has-text("handmatig"), button:has-text("manually"), .AddressAutocomplete-manual-entry .Link');
              if (await handmatig.first().isVisible().catch(() => false)) await handmatig.first().click();
              await vul('#billingAddressLine1', 'Bellamypark 1');
              await vul('#billingPostalCode', '4381 CG');
              await vul('#billingLocality', 'Vlissingen');
              await shot(p, 'stripe-ingevuld');
              await p.locator('.SubmitButton, button[type=submit]').first().click();
              await p.waitForURL('**/signup**', { timeout: 60000 }).catch(async (e) => { await shot(p, 'stripe-fout'); log('stripe bleef op ' + p.url()); throw e; });
            } else {
              log('LET OP: nog testbetaalpagina, geen Stripe');
              await p.locator('.v-auth__btn').click();
              await p.waitForURL('**/signup**');
            }
            await p.fill('#naam', 'Test Klant'); await p.fill('#bedrijf', 'Testbedrijf BV'); await p.fill('#email', mail); await p.fill('#wachtwoord', 'geheim12345');
            await p.locator('.v-auth__btn').click();
            await p.waitForURL('**/login**');
            await p.waitForSelector('text=Your account has been created');
            await p.fill('#email', mail); await p.fill('#wachtwoord', 'geheim12345'); await p.locator('.v-auth__btn').click();
            await p.waitForURL('**/dashboard', { timeout: 20000 }).catch(async () => { log('login fout: ' + p.url() + ' | ' + (await p.locator('main').innerText()).replace(/\n/g, ' / ').slice(0, 300)); await shot(p, 'loginfout'); throw new Error('stop'); });
            await p.waitForSelector('.v-home__groet');
            await p.locator('.v-dash__nav button', { hasText: 'Settings' }).click(); await p.locator('.v-instel__nav button', { hasText: 'Subscription' }).click();
            await p.locator('.v-billing button').click();
            await p.waitForURL((u) => u.hostname.includes('stripe.com'), { timeout: 30000 }).then(() => log('portal geopend: ' + p.url().slice(0, 50))).catch(async () => log('portal fout: ' + (await p.locator('.v-billing .v-err').textContent().catch(() => '?'))));
            await shot(p, 'portal');
            await p.goBack().catch(() => {});
            await p.goto(U + '/pricing', { waitUntil: 'networkidle' });
            await p.locator('.v-plan__cta--pro').click();
            await p.waitForURL('**/dashboard', { timeout: 30000 }).then(() => log('wissel naar pro: ok, ' + p.url())).catch(async () => log('wissel fout: ' + p.url() + ' ' + (await p.locator('.v-err').textContent().catch(() => '?'))));
            await p.waitForTimeout(1500);
            log('pakket na wissel: ' + (await p.locator('.v-dash__me small').textContent().catch(() => '?')));
            log('nieuwe klant -> ' + new URL(p.url()).pathname + ' | ' + (await p.locator('.v-home__groet h1').textContent()) + ' | banner: ' + ((await p.locator('.v-dash__banner').textContent().catch(() => '')) || '').slice(0, 60));
            await ctx.close();
          }
          // Uitgelogd: landingspagina, juridisch, wachtwoord vergeten
          {
            const ctx = await b.newContext({ viewport: { width: 1366, height: 860 }, deviceScaleFactor: 2 });
            const p = await ctx.newPage();
            p.on('pageerror', (e) => log('JS-fout: ' + e.message));
            for (const r of ['/terms', '/dpa', '/cookies', '/privacy', '/forgot-password', '/og.png']) {
              const res = await p.goto(U + r); log('pagina ' + r + ' ' + res.status());
            }
            await p.goto(U + '/forgot-password'); await shot(p, 'vergeten');
            await p.fill('#email', 'demo@volgo.test'); await p.click('button[type=submit]');
            await p.waitForSelector('.v-auth__ok, .v-err', { timeout: 15000 });
            log('vergeten -> ' + (await p.locator('.v-auth__ok, .v-err').first().textContent()));
            await p.goto(U + '/', { waitUntil: 'networkidle' });
            const font = await p.evaluate(() => [getComputedStyle(document.querySelector('h1')).fontFamily, getComputedStyle(document.body.querySelector('.volgo')).fontFamily, document.fonts.check('600 40px "Bricolage Grotesque"')]);
            log('fonts ' + JSON.stringify(font));
            await p.evaluate(async () => { for (let y = 0; y < document.body.scrollHeight; y += 600) { window.scrollTo(0, y); await new Promise((r) => setTimeout(r, 120)); } window.scrollTo(0, 0); });
            await p.screenshot({ path: '/tmp/shots/landing-full.png', fullPage: true });
            await shot(p, 'landing');
            await p.goto(U + '/login'); await shot(p, 'inloggen');
            await p.goto(U + '/terms'); await shot(p, 'voorwaarden');
            await ctx.close();
          }
          for (const [naam, vp] of [['desktop', { width: 1366, height: 860 }], ['mobiel', { width: 390, height: 844 }]]) {
            const ctx = await b.newContext({ viewport: vp, deviceScaleFactor: 2 });
            await ctx.addCookies([{ name: 'volgo_sessie', value: T, domain: new URL(U).hostname, path: '/', httpOnly: true, secure: true, sameSite: 'Lax' }]);
            const p = await ctx.newPage();
            p.on('pageerror', (e) => log(naam + ' JS-fout: ' + e.message));
            await p.goto(U + '/', { waitUntil: 'networkidle' });
            log(naam + ' / blijft op ' + new URL(p.url()).pathname + ' knop: ' + (await p.locator('.v-nav__cta').textContent())); await p.goto(U + '/dashboard', { waitUntil: 'networkidle' });
            await p.waitForSelector('.v-start', { timeout: 10000 }).catch(() => log(naam + ' geen aan-de-slag'));
            await shot(p, naam + '-home');
            if (naam === 'mobiel') {
              await p.locator('.v-mnav button', { hasText: 'Chats' }).click(); await p.waitForTimeout(1200); await shot(p, 'm-chats');
              if (await p.locator('.v-dm__item').count()) { await p.locator('.v-dm__item').first().click(); await p.waitForTimeout(1500); await shot(p, 'm-chat-open'); await p.locator('.v-dm__terug').click(); }
              await p.locator('.v-mnav button', { hasText: 'Leads' }).click(); await p.waitForTimeout(800); await shot(p, 'm-leads');
              await p.locator('.v-mnav button', { hasText: 'Calendar' }).click(); await p.waitForTimeout(800); await shot(p, 'm-agenda');
              await p.locator('.v-mnav button', { hasText: 'More' }).click(); await p.waitForTimeout(500); await shot(p, 'm-meer');
              await p.locator('.v-sheet__paneel button', { hasText: 'Settings' }).click(); await p.waitForTimeout(1200); await shot(p, 'm-settings');
              await p.locator('.v-dash__profiel .v-profiel__knop').click(); await p.waitForTimeout(500); await shot(p, 'm-profiel'); await p.keyboard.press('Escape');
            }
            if (naam === 'desktop') {
              await p.locator('.v-dash__nav button', { hasText: 'Settings' }).click(); await p.locator('.v-instel__nav button', { hasText: 'Account' }).click();
              await p.waitForSelector('#acc-naam'); await shot(p, 'account');
              await p.fill('#acc-naam', 'Damien Demo'); await p.locator('button', { hasText: 'Save' }).click();
              await p.waitForSelector('.v-ok-tekst, .v-err'); log('account opslaan -> ' + (await p.locator('.v-ok-tekst, .v-err').first().textContent()));
              await p.fill('#acc-huidig', 'fout-wachtwoord'); await p.fill('#acc-nieuw', 'nieuwwachtwoord1'); await p.fill('#acc-herhaal', 'nieuwwachtwoord1');
              await p.locator('button', { hasText: 'Change password' }).click();
              await p.waitForTimeout(2500); log('wachtwoord fout -> ' + (await p.locator('.v-err').last().textContent().catch(() => '?')));
              await p.locator('.v-dash__nav button', { hasText: 'Settings' }).click(); await p.locator('.v-instel__nav button', { hasText: 'Notifications' }).click(); await p.waitForSelector('.v-toggle'); log('toggles: ' + (await p.locator('.v-toggle strong').allTextContents()).join(' | ')); await p.locator('.v-dash__nav button', { hasText: 'Settings' }).click(); await p.locator('.v-instel__nav button', { hasText: 'Style' }).click();
              await p.locator('.v-ed-kaart button', { hasText: 'Open the editor' }).click();
              await p.waitForSelector('.v-ed__zij'); await p.waitForTimeout(2500);
              await p.fill('#ed-knop', 'Chat with us');
              await p.locator('.v-ed__groepkop', { hasText: 'Colour' }).click(); await p.locator('.v-ed__groepin .v-seg button', { hasText: 'Dark' }).click();
              await p.locator('.v-ed__groepkop', { hasText: 'Chat window' }).click(); await p.locator('.v-ed__kaarten button', { hasText: 'Sharp' }).click();
              await p.locator('.v-ed__groepkop', { hasText: 'Position' }).click(); await p.locator('.v-ed__groepin .v-seg button', { hasText: 'Bottom left' }).click();
              await p.locator('.v-ed__groepkop', { hasText: 'Invitation' }).click(); const sw = p.locator('.v-ed__groepin .v-toggle input').nth(1); if (await sw.isChecked()) await sw.click({ force: true });
              await p.locator('.v-ed__opslaan').click(); await p.waitForFunction(() => /Saved|Couldn/.test(document.querySelector('.v-ed__staat')?.textContent || ''), null, { timeout: 15000 }).catch(() => {});
              log('stijl: ' + (await p.locator('.v-ed__staat').textContent())); await shot(p, 'stijl');
              await p.locator('.v-ed__terug').click(); await p.waitForSelector('.v-dash__nav');
              await p.locator('.v-dash__nav button', { hasText: 'Settings' }).click();
              await p.locator('.v-instel__nav button', { hasText: 'Install' }).click();
              const key = await p.locator('input[aria-label="Install code"]').inputValue();
              const sleutel = key.match(/data-key="([^"]+)"/)[1];
              const bctx = await b.newContext({ viewport: { width: 1280, height: 860 } });
              const p2 = await bctx.newPage(); await p2.goto(U + '/demo/' + sleutel, { waitUntil: 'networkidle' }); await p2.waitForTimeout(2000); await p2.locator('#volgo-ava .ok-ja').click({ timeout: 6000 }).catch(() => {});
              await p2.locator('#volgo-ava .fab').click(); await p2.waitForTimeout(800);
              await p2.locator('#volgo-ava textarea').fill('Hi, can you send me a quote for a heat pump?'); await p2.keyboard.press('Enter');
              await p2.waitForFunction(() => document.querySelector('#volgo-ava').shadowRoot.querySelectorAll('.b.a:not(.typ)').length >= 2, null, { timeout: 40000 });
              await p.locator('.v-dash__nav button', { hasText: 'Chats' }).click();
              await p.waitForSelector('.v-dm__item'); await p.reload({ waitUntil: 'networkidle' }); await p.locator('.v-dash__nav button', { hasText: 'Chats' }).click();
              await p.locator('.v-dm__item').first().click(); await p.waitForTimeout(1500);
              log('gekozen gesprek: ' + (await p.locator('.v-dm__wie strong').textContent()) + ' / berichten: ' + (await p.locator('.v-dm__b').count()));
              await p.locator('.v-dm__modus button', { hasText: 'Take over' }).click();
              await p.waitForSelector('.v-dm__invoer textarea', { timeout: 15000 });
              await p.fill('.v-dm__invoer textarea', 'Hi! This is Damien from the team. I can send you a quote today. What is your postcode?');
              await p.locator('.v-dm__invoer button').click();
              await p2.waitForFunction(() => document.querySelector('#volgo-ava').shadowRoot.querySelectorAll('.b.h').length >= 1, null, { timeout: 30000 }).catch(async (e) => { await p2.screenshot({ path: '/tmp/shots/overname-bezoeker.png' }); await shot(p, 'overname-dashboard'); throw e; });
              log('overname: bezoeker ziet ' + (await p2.locator('#volgo-ava .b.h').last().textContent()).slice(0, 80) + ' | kop: ' + (await p2.locator('#volgo-ava .sub').textContent()));
              await p2.locator('#volgo-ava textarea').fill('4381 AB, thanks!'); await p2.keyboard.press('Enter'); await p2.waitForTimeout(3500);
              await p2.screenshot({ path: '/tmp/shots/overname-bezoeker.png' });
              await p.waitForTimeout(3000); await shot(p, 'overname-dashboard');
              log('ava stil: ' + (await p.locator('.v-dm__b--wij:not(.is-mens)').count()) + ' ava-berichten, laatste bezoeker: ' + (await p.locator('.v-dm__b--zij').last().textContent()).slice(0, 40));
              await p.locator('.v-dm__modus button', { hasText: 'AVA auto' }).click(); await p.waitForTimeout(1500);
              await bctx.close();
              await p.locator('.v-dash__profiel .v-profiel__knop').click(); await p.waitForTimeout(400); await shot(p, 'profiel-menu');
              await p.locator('.v-profiel__menu button', { hasText: 'Profile & account' }).click(); await p.waitForTimeout(600);
              await p.fill('#acc-functie', 'Owner'); await p.locator('button', { hasText: 'Save profile' }).click(); await p.waitForTimeout(1500);
              log('profiel: ' + (await p.locator('.v-ok-tekst, .v-err').first().textContent().catch(() => '?')) + ' | menu kop: ' + ((await p.locator('.v-dash__me-knop').innerText().catch(() => '?')).replace(/\n/g, ' ')));
              await shot(p, 'profiel-pagina');
              await p.locator('.v-dash__nav button', { hasText: 'Settings' }).click(); await p.locator('.v-instel__nav button', { hasText: 'Subscription' }).click();
              await p.waitForSelector('.v-billing button'); await shot(p, 'subscription');
              await p.locator('.v-dash__nav button', { hasText: 'Team' }).click(); await p.waitForTimeout(800); await shot(p, 'team-start');
              await p.locator('.v-dash__nav button', { hasText: 'Website' }).click(); await p.waitForTimeout(1500);
              if (await p.locator('#w-wensen').count()) { await shot(p, 'website-form'); await p.fill('#w-wensen', 'Pages for our services, a gallery of finished jobs and a short video on the homepage. Calm green colors.'); await p.fill('#w-domein', 'volgodemo.nl'); await p.locator('button', { hasText: 'Request my website' }).click(); await p.waitForSelector('.v-tijdlijn', { timeout: 15000 }); }
              await shot(p, 'website-status');
              await p.goto(U + '/pricing', { waitUntil: 'networkidle' }); await p.screenshot({ path: '/tmp/shots/pricing-full.png', fullPage: true }); await p.goto(U + '/dashboard', { waitUntil: 'networkidle' });
              await p.locator('.v-dash__brand').click(); await p.waitForSelector('.v-home__groet');
              await p.locator('.v-home__tips button').first().click();
              await p.waitForSelector('.v-home__msg--ava p:not(.v-home__typen)', { timeout: 40000 });
              await shot(p, 'desktop-chat');
            }
            await ctx.close();
          }
          await b.close();
          JS
          mkdir -p /tmp/shots && node t.mjs 2>&1 | tee n.log; c=${PIPESTATUS[0]}; [ $c = 0 ] || { grep -v '^::' n.log | tail -8 | sed 's/^/::error::/'; exit 1; }
      - name: Screenshots bewaren
        if: always()
        run: |
          git config user.name "volgo-bot"; git config user.email "bot@volgo.local"
          git fetch origin testshots 2>/dev/null && git checkout testshots || git checkout --orphan testshots
          git rm -rq . 2>/dev/null || true
          cp /tmp/shots/*.png . 2>/dev/null || true
          git add *.png 2>/dev/null && git commit -qm "screenshots" && git push -qf origin HEAD:testshots || true
