name: Code controleren
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install > /dev/null 2>&1
      - name: TypeScript
        run: |
          npx vite build > /dev/null 2>&1 || echo "::warning::BUILD faalde"
          ls src/routeTree.gen.ts
          npx tsc --noEmit -p . > tsc.txt 2>&1 || true
          echo "::warning::TSC $(grep -c 'error TS' tsc.txt) fouten"
          grep 'error TS' tsc.txt | sed -n '1,9p' | sed 's/^/::warning::A /'
      - run: grep 'error TS' tsc.txt | sed -n '10,18p' | sed 's/^/::warning::B /'
      - run: grep 'error TS' tsc.txt | sed -n '19,27p' | sed 's/^/::warning::C /'
      - run: grep 'error TS' tsc.txt | sed -n '28,36p' | sed 's/^/::warning::D /'
      - run: |
          mkdir -p /tmp/out && cp tsc.txt /tmp/out/
      - name: Uitvoer bewaren
        run: |
          git config user.name "volgo-bot"; git config user.email "bot@volgo.local"
          git checkout --orphan ci-logs; git rm -rq . ; cp /tmp/out/tsc.txt .; git add tsc.txt; git commit -qm logs; git push -qf origin HEAD:ci-logs
