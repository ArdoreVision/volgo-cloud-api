name: Beheer (eenmalige database-actie)
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          q() { npx -y wrangler@4 d1 execute volgo-db --remote --json --command "$1" 2>/dev/null | jq -c '.[0].results'; }
          q "UPDATE gebruikers SET status = 'verlopen' WHERE email IN ('demo@volgo.test','badkamer-demo@volgo.test','contractor-demo@volgo.test')" >/dev/null
          q "DELETE FROM sessies WHERE gebruiker_id IN (SELECT id FROM gebruikers WHERE email IN ('demo@volgo.test','badkamer-demo@volgo.test','contractor-demo@volgo.test'))" >/dev/null
          echo "::warning::STATUS $(q "SELECT id, email, status FROM gebruikers ORDER BY id")"
          echo "::warning::SESSIES $(q "SELECT gebruiker_id, COUNT(*) n FROM sessies WHERE verloopt > datetime('now') GROUP BY gebruiker_id")"
