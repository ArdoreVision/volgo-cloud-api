name: Editor screenshots
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          TOKEN=$(openssl rand -hex 32); HASH=$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1); echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          cd /tmp && npx -y wrangler@4 d1 execute volgo-db --remote --command "UPDATE gebruikers SET plan='pro' WHERE email='demo@volgo.test'; INSERT INTO sessies (token_hash, gebruiker_id, verloopt) SELECT '$HASH', id, datetime('now','+1 hour') FROM gebruikers WHERE email='demo@volgo.test';" > w.log 2>&1 || { tail -5 w.log; exit 1; }
      - run: |
          mkdir -p /tmp/pw /tmp/shots && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const log = (m) => { console.log('::warning::ED ' + m); };
          const b = await chromium.launch();
          const c = await b.newContext({ viewport: { width: 1440, height: 900 } });
          await c.addCookies([{ name: 'volgo_sessie', value: process.env.TOKEN, domain: 'thevolgo.app', path: '/', httpOnly: true, secure: true }]);
          const p = await c.newPage(); p.on('pageerror', (e) => log('JS-fout ' + e.message));
          p.on('dialog', (d) => d.accept());
          await p.goto('https://thevolgo.app/dashboard'); await p.waitForTimeout(2500);
          await p.locator('.v-dash__nav button', { hasText: 'Customize' }).click();
          await p.waitForSelector('.v-ed__zij'); await p.waitForTimeout(4000);
          const fr = p.frameLocator('.v-ed__scherm iframe');
          log('fab zichtbaar: ' + await fr.locator('#volgo-ava').count());
          const pf = p.frames().find((f) => f.url().includes('ava-preview'));
          log('preview url: ' + (pf && pf.url()));
          log('ava.js heeft preview: ' + (await (await fetch('https://thevolgo.app/ava.js')).text()).includes('data-preview'));
          const kh = async () => pf ? await pf.evaluate(() => { const h = document.getElementById('volgo-ava'); return h ? h.shadowRoot.querySelector('.w').className : 'geen'; }) : '?';
          log('klassen start: ' + await kh());
          await p.screenshot({ path: '/tmp/shots/1-start.png' });
          await p.locator('.v-ed__kaarten button', { hasText: 'Chat icon' }).click(); await p.waitForTimeout(800);
          await p.screenshot({ path: '/tmp/shots/2-icoon.png' });
          log('klassen na icoon: ' + await kh());
          await p.locator('.v-ed__groepkop', { hasText: 'Chat window' }).click();
          await p.locator('.v-ed__kaarten button', { hasText: 'Sharp' }).click();
          await p.locator('.v-seg button', { hasText: 'Large' }).click();
          await p.locator('.v-ed__chatknop').click(); await p.waitForTimeout(1200);
          await p.screenshot({ path: '/tmp/shots/3-venster-open.png' });
          await p.locator('.v-ed__groepkop', { hasText: 'Colour' }).click();
          await p.locator('.v-ed__kleuren > button').nth(3).click();
          await p.locator('.v-seg button', { hasText: 'Dark' }).click(); await p.waitForTimeout(800);
          await p.screenshot({ path: '/tmp/shots/4-donker.png' });
          await p.locator('.v-ed__groepkop', { hasText: 'Position' }).click();
          await p.locator('.v-seg button', { hasText: 'Bottom left' }).click();
          await p.locator('.v-ed__chatknop').click();
          await p.locator('.v-ed__groepkop', { hasText: 'Invitation' }).click();
          await p.locator('.v-ed__groepin .v-toggle input').first().check({ force: true }); await p.waitForTimeout(1200);
          await p.locator('.v-ed__apparaat button[aria-label="Mobile"]').click(); await p.waitForTimeout(3500);
          await p.screenshot({ path: '/tmp/shots/5-mobiel.png' });
          await p.locator('.v-ed__apparaat button[aria-label="Desktop"]').click();
          await p.locator('.v-ed__groepkop', { hasText: 'Your website' }).click();
          await p.fill('#ed-site', 'example.com'); await p.locator('.v-ed__rij button').click(); await p.waitForTimeout(5000);
          log('site melding: ' + await p.locator('.v-ed__hint').first().textContent());
          await p.screenshot({ path: '/tmp/shots/6-eigen-site.png' });
          log('staat voor opslaan: ' + await p.locator('.v-ed__staat').textContent());
          await p.locator('.v-ed__opslaan').click(); await p.waitForTimeout(2500);
          log('staat na opslaan: ' + await p.locator('.v-ed__staat').textContent());
          const cfg = await (await fetch('https://thevolgo.app/api/ava', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ actie: 'config', sleutel: await fr.locator('body').evaluate(() => new URLSearchParams(location.search).get('k')) }) })).json();
          log('config na opslaan: ' + JSON.stringify({ knop: cfg.knop, vorm: cfg.vorm, grootte: cfg.grootte, thema: cfg.thema, positie: cfg.positie, uitnodiging: cfg.uitnodiging, kleur: cfg.kleur }));
          await p.reload(); await p.waitForTimeout(1500);
          await p.locator('.v-dash__nav button', { hasText: 'Customize' }).click().catch(() => {});
          await p.waitForTimeout(4000); await p.screenshot({ path: '/tmp/shots/7-na-herladen.png' });
          // terugzetten naar standaard
          await p.locator('.v-ed__groepkop', { hasText: 'Chat button' }).click().catch(() => {});
          await b.close();
          JS
          TOKEN=$TOKEN node s.mjs
          cd /tmp/shots && git init -q && git config user.name bot && git config user.email bot@x && git add -A && git commit -qm s && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:edshots
