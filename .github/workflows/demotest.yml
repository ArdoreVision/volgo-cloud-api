name: Demo badkamer testen
on:
  workflow_dispatch:
    inputs:
      pw: { description: "wachtwoord demo", required: true }
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      PW: ${{ inputs.pw }}
      U: https://thevolgo.app
    steps:
      - run: |
          mkdir -p /tmp/pw /tmp/shots && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const log = (m) => console.log('::warning::DEMO ' + m);
          const b = await chromium.launch();
          // Bezoeker op mobiel
          const mob = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
          const m = await mob.newPage(); await m.goto(process.env.U + '/voorbeeld/badkamer', { waitUntil: 'networkidle' }); await m.waitForTimeout(1500);
          await m.screenshot({ path: '/tmp/shots/m-site.png' });
          // Bezoeker op desktop
          const ctx = await b.newContext({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 2 });
          const p = await ctx.newPage(); p.on('pageerror', (e) => log('JS-fout ' + e.message));
          await p.goto(process.env.U + '/voorbeeld/badkamer', { waitUntil: 'networkidle' }); await p.waitForTimeout(1500);
          await p.screenshot({ path: '/tmp/shots/site.png' });
          log('knop: ' + await p.locator('.lbl').textContent().catch(() => '?'));
          await p.locator('.hero [data-ava-open]').click(); await p.waitForTimeout(800);
          const vraag = async (t) => {
            const n = await p.locator('.b.a').count();
            await p.locator('textarea').fill(t); await p.locator('.send').click();
            await p.waitForFunction((n) => { const h = document.querySelector('#volgo-ava, [id^=volgo]') ; return true; }, n);
            await p.locator('.b.a:not(.typ)').nth(n).waitFor({ timeout: 60000 });
            await p.waitForTimeout(500);
            const a = await p.locator('.b.a:not(.typ)').nth(n).textContent();
            log('bezoeker: ' + t + ' || AVA: ' + a.replace(/\n/g, ' ').slice(0, 330));
          };
          log('begroeting: ' + await p.locator('.b.a').first().textContent().catch(() => '?'));
          await vraag('Hoi, wat kost ongeveer een inloopdouche? Ons bad is 170 cm en we willen het eruit hebben.');
          await vraag('We wonen in Middelburg. Kunnen jullie in januari beginnen?');
          await vraag('Prima, ik ben Sanne de Wit, bel me maar op 06 12345678 voor een afspraak om in te meten.');
          await p.screenshot({ path: '/tmp/shots/chat.png' });
          // Eigenaar van het badkamerbedrijf logt in
          const e = await b.newContext({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 2 });
          const d = await e.newPage();
          await d.goto(process.env.U + '/login'); await d.fill('#email', 'badkamer-demo@volgo.test'); await d.fill('#wachtwoord', process.env.PW); await d.locator('.v-auth__btn').click();
          await d.waitForURL('**/dashboard', { timeout: 20000 }).catch(async () => log('login mislukt: ' + d.url()));
          await d.waitForTimeout(2000); await d.screenshot({ path: '/tmp/shots/dash-home.png' });
          await d.locator('.v-dash__nav button', { hasText: 'Conversations' }).click(); await d.waitForTimeout(2500);
          await d.locator('.v-gesprek, .v-gesprekken__lijst button, .v-gesprekken li').first().click().catch(() => {});
          await d.waitForTimeout(1500); await d.screenshot({ path: '/tmp/shots/dash-gesprek.png' });
          await d.locator('.v-dash__nav button', { hasText: 'Requests' }).click(); await d.waitForTimeout(2500);
          await d.screenshot({ path: '/tmp/shots/dash-leads.png' });
          log('leads: ' + (await d.locator('main').innerText()).replace(/\n/g, ' | ').slice(0, 400));
          await b.close();
          JS
          node t.mjs
      - if: always()
        run: |
          cd /tmp/shots && git init -q && git config user.name bot && git config user.email bot@x && git add -A && git commit -qm s && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:demoshots || true
