name: Spotter online zetten

# Every push to the 'spotter' branch builds and deploys Spotter as its own worker ("spotter") with its own database.
# Volgo (main branch, worker "volgo") is not touched.
on:
  push:
    branches: [spotter]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spotter-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Database
        run: |
          zoek_id() {
            npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="spotter-db");process.stdout.write(d?(d.uuid||d.id||""):"")})'
          }
          ID=$(zoek_id)
          if [ -z "$ID" ]; then npx wrangler d1 create spotter-db; ID=$(zoek_id); fi
          if [ -z "$ID" ]; then echo "::error::Could not create or find spotter-db"; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.jsonc
          npx wrangler d1 migrations apply spotter-db --remote

      - name: Address
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -n "$SUB" ]; then echo "URL=https://spotter.$SUB.workers.dev" >> $GITHUB_ENV; fi
          echo "::warning::SUBDOMAIN ${SUB:-unknown}"

      - name: Deploy
        run: |
          set +e
          if [ -n "$URL" ]; then npx wrangler deploy --var "PUBLIC_URL:$URL" 2>&1 | tee deploy.log; else npx wrangler deploy 2>&1 | tee deploy.log; fi
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then tail -25 deploy.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
          if [ -z "$URL" ]; then U=$(grep -o 'https://spotter[^ ]*workers.dev' deploy.log | head -1); echo "URL=$U" >> $GITHUB_ENV; fi
          grep -o 'https://[^ ]*' deploy.log | sed 's/^/::warning::ADRES /'

      - name: Keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PUSH_TOPIC: ${{ secrets.PUSH_TOPIC }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          node -e 'const o={};for(const k of ["ANTHROPIC_API_KEY","RESEND_API_KEY","STRIPE_SECRET_KEY","PUSH_TOPIC","META_APP_ID","META_APP_SECRET"]){if(process.env[k])o[k]=process.env[k]}require("fs").writeFileSync("/tmp/s.json",JSON.stringify(o));console.log("keys:",Object.keys(o).join(", "))'
          npx wrangler secret bulk /tmp/s.json
          rm /tmp/s.json

      - name: Check live
        run: |
          sleep 8
          echo "# Spotter status" > STATUS.md
          echo "" >> STATUS.md
          echo "Deployed: $(date -u +%Y-%m-%dT%H:%MZ)  " >> STATUS.md
          echo "Address: $URL  " >> STATUS.md
          H=$(curl -s "$URL/health"); echo "Health: \`$H\`" >> STATUS.md
          echo "::warning::HEALTH $H"
          echo "" >> STATUS.md
          echo "## Live demo chat (real Claude)" >> STATUS.md
          hist='[{"role":"lead","text":"hey saw your reel, how does your coaching work?"}]'
          for say in "i want to lose like 8kg before summer" "tried keto and the gym alone but i always quit after a few weeks" "yeah honestly i need someone to keep me accountable, ready to invest" "how much is it?"; do
            R=$(curl -s -X POST "$URL/api/demo" -H 'content-type: application/json' -d "{\"history\":$hist}" | jq -r '.reply')
            echo "- **Spotter:** $R" >> STATUS.md
            echo "- **Lead:** $say" >> STATUS.md
            hist=$(echo "$hist" | jq -c --arg r "$R" --arg s "$say" '. + [{"role":"bot","text":$r},{"role":"lead","text":$s}]')
          done
          R=$(curl -s -X POST "$URL/api/demo" -H 'content-type: application/json' -d "{\"history\":$hist}" | jq -r '.reply')
          echo "- **Spotter:** $R" >> STATUS.md
          cat STATUS.md

      - name: Stripe check
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          # Creates the exact checkout Spotter uses (7 days for €1, then €297/month) and expires it right away. Nothing is charged.
          R=$(curl -s https://api.stripe.com/v1/checkout/sessions -u "$STRIPE_SECRET_KEY:" \
            -d mode=subscription -d customer_email=check@spotter.test -d client_reference_id=0 \
            -d "subscription_data[trial_period_days]=7" \
            -d "line_items[0][quantity]=1" -d "line_items[0][price_data][currency]=eur" -d "line_items[0][price_data][unit_amount]=29700" \
            -d "line_items[0][price_data][recurring][interval]=month" -d "line_items[0][price_data][product_data][name]=Spotter, AI DM setter" \
            -d "line_items[1][quantity]=1" -d "line_items[1][price_data][currency]=eur" -d "line_items[1][price_data][unit_amount]=100" \
            -d "line_items[1][price_data][product_data][name]=Spotter, first 7 days" \
            -d allow_promotion_codes=true -d "success_url=$URL/billing/return?session_id={CHECKOUT_SESSION_ID}" -d "cancel_url=$URL/billing")
          ID=$(echo "$R" | jq -r '.id // empty'); LIVE=$(echo "$R" | jq -r '.livemode')
          if [ -n "$ID" ]; then
            curl -s -X POST "https://api.stripe.com/v1/checkout/sessions/$ID/expire" -u "$STRIPE_SECRET_KEY:" > /dev/null
            echo "::warning::STRIPE OK livemode=$LIVE (test session created and expired)"
            echo "" >> STATUS.md; echo "Stripe checkout: OK (livemode=$LIVE)" >> STATUS.md
          else
            echo "::warning::STRIPE FAIL $(echo "$R" | jq -c '.error')"
            echo "" >> STATUS.md; echo "Stripe checkout: FAILED $(echo "$R" | jq -c '.error.message')" >> STATUS.md
          fi

      - name: Screenshots
        run: |
          mkdir -p status /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          EMAIL="smoke+$GITHUB_RUN_ID@spotter.test"
          cat > s.mjs <<'JS'
          import { chromium } from 'playwright';
          const U = process.env.URL, out = process.env.GITHUB_WORKSPACE + '/status/';
          const b = await chromium.launch();
          for (const [name, vp] of [['desktop', { width: 1366, height: 900 }], ['mobile', { width: 390, height: 844 }]]) {
            const c = await b.newContext({ viewport: vp, deviceScaleFactor: 1 });
            const p = await c.newPage();
            await p.goto(U + '/', { waitUntil: 'networkidle' }); await p.screenshot({ path: out + `landing-${name}.png`, fullPage: name === 'desktop' });
            if (name === 'desktop') {
              await p.goto(U + '/start'); await p.screenshot({ path: out + 'signup.png' });
              await p.fill('#name', 'Smoke Test'); await p.fill('#email', process.env.EMAIL); await p.fill('#password', 'smoke-test-pass-123');
              await Promise.all([p.waitForNavigation(), p.click('button[type=submit]')]);
              await p.fill('#f-name', 'Coach Smoke'); await p.fill('#f-program', '12 weeks 1:1 online coaching, custom training and macros, weekly check-in.');
              await p.fill('#f-price', '€997 for 12 weeks'); await p.fill('#f-fit', 'Women 25-45 who want to lose 5-15 kg'); await p.fill('#f-link', 'calendly.com/smoke/call');
              await Promise.all([p.waitForNavigation(), p.click('#setter-form button[type=submit]')]);
              await p.waitForTimeout(6000);
              await p.screenshot({ path: out + 'setup.png', fullPage: true });
              console.log('TESTCHAT ' + (await p.locator('#t-msgs').innerText()).replace(/\n/g, ' | '));
            }
            await c.close();
          }
          await b.close();
          JS
          URL=$URL EMAIL=$EMAIL node s.mjs 2>&1 | sed 's/^/::warning::/'
          cd $GITHUB_WORKSPACE
          npx wrangler d1 execute spotter-db --remote --command "UPDATE coaches SET status='free' WHERE email='$EMAIL'" >/dev/null
          cat > /tmp/pw/d.mjs <<'JS'
          import { chromium } from 'playwright';
          const U = process.env.URL, out = process.env.GITHUB_WORKSPACE + '/status/';
          const b = await chromium.launch(); const c = await b.newContext({ viewport: { width: 1366, height: 900 } }); const p = await c.newPage();
          await p.goto(U + '/login'); await p.fill('#email', process.env.EMAIL); await p.fill('#password', 'smoke-test-pass-123');
          await Promise.all([p.waitForNavigation(), p.click('button[type=submit]')]);
          for (const path of ['dashboard', 'connect', 'inbox', 'billing']) { await p.goto(U + '/' + path, { waitUntil: 'networkidle' }); await p.screenshot({ path: out + path + '.png', fullPage: true }); }
          await b.close();
          JS
          cd /tmp/pw && URL=$URL EMAIL=$EMAIL node d.mjs 2>&1 | sed 's/^/::warning::/'; cd $GITHUB_WORKSPACE
          npx wrangler d1 execute spotter-db --remote --command "DELETE FROM sessions WHERE coach_id IN (SELECT id FROM coaches WHERE email LIKE 'smoke+%@spotter.test'); DELETE FROM events WHERE coach_id IN (SELECT id FROM coaches WHERE email LIKE 'smoke+%@spotter.test'); DELETE FROM coaches WHERE email LIKE 'smoke+%@spotter.test'" >/dev/null
          ls -la status

      - name: Save status
        if: always()
        run: |
          git config user.name "spotter-bot"; git config user.email "spotter-bot@users.noreply.github.com"
          git checkout -- wrangler.jsonc
          git add STATUS.md status 2>/dev/null || true
          git commit -m "Spotter status [skip ci]" || exit 0
          git push
