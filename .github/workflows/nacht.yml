name: Nachtstand controleren
on:
  workflow_dispatch:
    inputs:
      pw: { description: "wachtwoord demo", required: true }
      bezoek: { description: "eerst bezoeken genereren", required: false, default: "ja" }
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    env:
      PW: ${{ inputs.pw }}
      BEZOEK: ${{ inputs.bezoek }}
    steps:
      - run: |
          mkdir -p /tmp/pw /tmp/shots && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          const log = (m) => console.log('::warning::NACHT ' + m);
          const b = await chromium.launch();
          const U = 'https://thevolgo.app';
          if (process.env.BEZOEK === 'ja') {
            const varianten = [
              [{ viewport: { width: 1440, height: 900 } }, '?utm_source=google'],
              [{ ...devices['iPhone 13'] }, '?utm_source=instagram'],
              [{ viewport: { width: 1280, height: 800 } }, ''],
              [{ ...devices['Pixel 7'] }, '?utm_source=facebook'],
              [{ ...devices['iPad Mini'] }, ''],
            ];
            for (const [opt, q] of varianten) {
              const c = await b.newContext(opt); const p = await c.newPage();
              await p.goto(U + '/voorbeeld/contractor' + q, { waitUntil: 'networkidle' }); await p.waitForTimeout(1500);
              await p.evaluate(async () => { for (let y = 0; y < document.body.scrollHeight; y += 500) { scrollTo(0, y); await new Promise((r) => setTimeout(r, 250)); } });
              await p.evaluate(() => history.pushState({}, '', '/voorbeeld/contractor#services')); await p.waitForTimeout(1200);
              if (q.includes('google')) { await p.locator('#volgo-ava .fab').click(); await p.waitForTimeout(800); }
              await p.waitForTimeout(2500);
              await p.close(); await c.close();
            }
            log('5 bezoeken gedaan');
          }
          for (const [n, vp, m] of [['d', { width: 1440, height: 900 }, false], ['m', { width: 390, height: 844 }, true]]) {
            const c = await b.newContext({ viewport: vp, deviceScaleFactor: m ? 2 : 1, isMobile: m, hasTouch: m, colorScheme: 'dark' });
            const p = await c.newPage(); p.on('pageerror', (e) => log('JS-fout ' + e.message));
            await p.goto(U + '/login'); await p.fill('#email', 'contractor-demo@volgo.test'); await p.fill('#wachtwoord', process.env.PW); await p.locator('.v-auth__btn').click();
            await p.waitForURL('**/dashboard', { timeout: 20000 }); await p.waitForTimeout(2000);
            log(n + ' thema bij start (systeem donker): ' + await p.locator('.v-dash').getAttribute('data-thema'));
            const ga = async (tab, f) => {
              if (m) { await p.locator('.v-mnav button', { hasText: 'More' }).click(); await p.waitForTimeout(400); await p.locator('.v-sheet__paneel button', { hasText: tab }).first().click(); }
              else await p.locator('.v-dash__nav button', { hasText: tab }).click();
              await p.waitForTimeout(1600); await p.screenshot({ path: `/tmp/shots/${n}-${f}.png`, fullPage: !m });
            };
            await p.screenshot({ path: `/tmp/shots/${n}-01-home.png` });
            if (!m) {
              await ga('Overview', '02-overview'); await ga('Traffic', '03-traffic'); await ga('Chats', '04-chats'); await ga('Requests', '05-requests');
              await ga('Calendar', '06-calendar'); await p.locator('.v-seg button', { hasText: 'Month' }).click(); await p.waitForTimeout(800); await p.screenshot({ path: `/tmp/shots/${n}-07-month.png` });
              await p.locator('.v-addbtn').click(); await p.waitForTimeout(600); await p.screenshot({ path: `/tmp/shots/${n}-08-new-appt.png` }); await p.keyboard.press('Escape');
              await p.goto(U + '/dashboard'); await p.waitForTimeout(1500);
              await ga('Team', '09-team'); await ga('Website', '10-website');
              await ga('Settings', '11-set-ava');
              for (const [s, f] of [['Style', '12-set-style'], ['Install', '13-set-install'], ['Notifications', '14-set-notif'], ['Account', '15-set-account'], ['Subscription', '16-set-sub']]) {
                await p.locator('.v-instel__nav button', { hasText: s }).click(); await p.waitForTimeout(1300); await p.screenshot({ path: `/tmp/shots/${n}-${f}.png`, fullPage: true });
              }
              await p.locator('.v-dash__profiel .v-profiel__knop').click(); await p.waitForTimeout(400); await p.screenshot({ path: `/tmp/shots/${n}-17-profielmenu.png` });
            } else {
              await p.locator('.v-mnav button', { hasText: 'Chats' }).click(); await p.waitForTimeout(1400); await p.screenshot({ path: `/tmp/shots/${n}-04-chats.png` });
              await p.locator('.v-mnav button', { hasText: 'Leads' }).click(); await p.waitForTimeout(1400); await p.screenshot({ path: `/tmp/shots/${n}-05-leads.png` });
              await p.locator('.v-mnav button', { hasText: 'More' }).click(); await p.waitForTimeout(500); await p.screenshot({ path: `/tmp/shots/${n}-06-more.png` }); await p.locator('.v-sheet').click({ position: { x: 10, y: 10 } });
              await ga('Traffic', '03-traffic');
              await ga('Overview', '02-overview');
            }
            await c.close();
          }
          await b.close();
          JS
          node s.mjs
          cd /tmp/shots && git init -q && git config user.name bot && git config user.email bot@x && git add -A && git commit -qm s && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:nachtshots
